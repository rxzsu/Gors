name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: ['1.22.x', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Install C23 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go build -o gors ./cmd/gors
      - run: ./gors --version
      - run: ./gors run examples/modules/main.gors --backend c
      - run: ./gors run examples/modules/main.gors --backend go
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add GCC to PATH
        shell: pwsh
        run: '"C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go build -o gors.exe ./cmd/gors
      - run: .\gors.exe --version
  archives:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - run: go run ./tools/package
      - uses: actions/upload-artifact@v4
        with:
          name: gors-0.1.0
          path: dist/*
